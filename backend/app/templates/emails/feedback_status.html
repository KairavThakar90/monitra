<!--
  Feedback status update — sent to the person who submitted the feedback when
  an administrator marks it Working or Resolved.

  The only variable part of the design is the status chip's colour and the
  three sentences around it; everything else is the same frame, the same type
  and the same spacing as the Admin/HR notification, so the two read as one
  product talking rather than two systems.

  Nothing on this page is user-written. `detail_rows` escapes every value it is
  given, and the headline and prose come from FEEDBACK_STATUS_PRESENTATION —
  fixed copy, chosen by status. The employee's own message is deliberately not
  reproduced here: they wrote it, and it does not need to travel back through a
  mailbox to reach them.
-->
{{ status_chip }}

<h1 class="st-h1" style="margin:0 0 16px 0;font-family:Helvetica,Arial,sans-serif;font-size:26px;line-height:34px;font-weight:700;color:#0F172A;letter-spacing:-0.3px;">
  {{ heading }}
</h1>

<p style="margin:0 0 18px 0;font-family:Helvetica,Arial,sans-serif;font-size:16px;line-height:26px;color:#374151;">
  {{ greeting }}
</p>

<p style="margin:0 0 18px 0;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:25px;color:#374151;">
  {{ lead }}
</p>

<p style="margin:0 0 26px 0;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:25px;color:#4B5563;">
  {{ body }}
</p>

<!-- Which submission this is about: category, where it now stands, and the day
     it was sent. Enough to tell two open pieces of feedback apart without
     quoting either of them back. -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0;border:1px solid #E8ECF3;border-radius:10px;border-collapse:separate;overflow:hidden;">
  {{ detail_rows }}
</table>

<p style="margin:26px 0 0 0;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:25px;color:#4B5563;">
  Thank you for helping us improve Monitra.
</p>
