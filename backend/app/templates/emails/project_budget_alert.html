<!--
  Fixed-hours budget alert — 50% / 20% / 10% remaining, 100% consumed or over
  budget. One project per email. The state is carried by the badge's text as
  well as its colour, and every value is escaped before it arrives here.
-->
{{ status_badge }}

<p style="margin:0 0 4px 0;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#64748B;">
  Project
</p>
<h1 class="st-h1" style="margin:0 0 12px 0;font-family:Helvetica,Arial,sans-serif;font-size:26px;line-height:34px;font-weight:700;color:#0F172A;letter-spacing:-0.3px;">
  {{ project_name }}
</h1>

<p style="margin:0 0 18px 0;font-family:Helvetica,Arial,sans-serif;font-size:16px;line-height:25px;font-weight:600;color:#1F2937;">
  {{ headline }}
</p>

<p style="margin:0 0 6px 0;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:24px;color:#374151;">
  {{ greeting }}
</p>
<p style="margin:0 0 22px 0;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:24px;color:#4B5563;">
  {{ message }}
</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0;border:1px solid #E8ECF3;border-radius:10px;border-collapse:separate;overflow:hidden;">
  {{ detail_rows }}
</table>

<p style="margin:14px 0 0 0;font-family:Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#6B7280;">
  Remaining is the fixed allocation minus used (billable) hours. Internal hours do not use the allocation.
</p>

{{ cta_block }}
