<!--
  Client passwordless login link — requested from the login screen. Single-use
  and short-lived (see AuthService.issue_handoff_token).
-->
<h1 class="st-h1" style="margin:0 0 14px 0;font-family:Helvetica,Arial,sans-serif;font-size:26px;line-height:34px;font-weight:700;color:#0F172A;letter-spacing:-0.3px;">
  Your Monitra sign-in link
</h1>

<p style="margin:0 0 22px 0;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:25px;color:#4B5563;">
  Use the button below to sign in to your Monitra client account. This link can
  only be used once and expires shortly, so request a new one if it has gone
  stale.
</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" class="st-cta">
  <tr><td align="center" style="background-color:#2563EB;border-radius:8px;">
    <a href="{{ login_url }}" style="display:inline-block;padding:13px 30px;font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;color:#FFFFFF;text-decoration:none;">Log in to Monitra</a>
  </td></tr>
</table>

<p style="margin:24px 0 0 0;font-family:Helvetica,Arial,sans-serif;font-size:13px;line-height:21px;color:#9AA3AF;">
  If you did not request this, you can safely ignore this email.
</p>
