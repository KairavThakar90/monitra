name: Desktop release

# Builds the distributable Monitra desktop packages for Windows and macOS.
#
# This is separate from desktop-stability.yml on purpose: that workflow proves
# the runtime is correct (tests, architecture boundaries, launch cycles, soak)
# and runs on every push; this one produces artifacts and is comparatively
# slow and expensive. Correctness is a precondition for a release, not a
# substitute for one -- so the build jobs here re-run the test suite and the
# architecture check on their own platform before packaging anything. A green
# Ubuntu run does not prove a Windows package works.
#
# macOS is built on a macOS runner because it cannot be built anywhere else: a
# .app contains Mach-O binaries and Qt frameworks produced by the host
# toolchain, and codesign/hdiutil exist only on macOS.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach the artifacts to a GitHub release"
        type: boolean
        default: false

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a half-finished release build

permissions:
  contents: read

env:
  # Pinned so the same source commit produces the same package. PyInstaller
  # collects different things between Python minor versions.
  PYTHON_VERSION: "3.12"

jobs:
  # ── Windows ────────────────────────────────────────────────────────────────
  windows:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: desktop
        shell: pwsh

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Read the version
        id: version
        run: |
          $v = python -c "import version; print(version.VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Monitra $v"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      # The packaged build must be built from code that passes, on this
      # platform. Windows is where the foreground-window ctypes path and the
      # pynput win32 backend actually run.
      - name: Architecture boundaries
        run: python tools/check_architecture.py

      # No release ships without a written release note for its version.
      - name: Changelog entry for this version
        run: python tools/check_changelog.py

      - name: Regression suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

      - name: Build application
        run: .\scripts\build_windows.ps1

      # Inno Setup is preinstalled on windows-latest runners; installing it
      # explicitly keeps the workflow working if that ever stops being true.
      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        run: .\scripts\build_installer.ps1

      # Signing is driven entirely by repository secrets, exactly as the macOS
      # job is. With the certificate absent -- the current state -- the build
      # produces an unsigned installer and says so, rather than failing or
      # pretending. Both the application .exe and the installer that wraps it
      # are signed: signing only the installer leaves SmartScreen warning about
      # the program it installs.
      #
      # This runs after build_installer.ps1 and before the checksums, because a
      # signature changes the file and therefore its SHA-256. Signing after
      # hashing would publish a digest that matches nothing anyone downloads,
      # and the desktop updater refuses an artifact whose hash disagrees.
      - name: Sign the application and installer
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        if: ${{ env.WINDOWS_CERTIFICATE != '' }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'monitra-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          try {
            $signtool = Get-ChildItem `
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName | Select-Object -Last 1
            if (-not $signtool) { throw "signtool.exe not found on this runner." }

            # RFC 3161 timestamping: without it every signature stops
            # validating the day the certificate expires, including on builds
            # already installed on staff machines.
            foreach ($target in @(
              'dist\Monitra\Monitra.exe',
              'dist\installer\Monitra-Setup-*.exe'
            )) {
              Get-ChildItem $target | ForEach-Object {
                & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
                  /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
                  /d "Monitra" $_.FullName
                if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.Name)" }
              }
            }
            & $signtool.FullName verify /pa /v 'dist\installer\Monitra-Setup-*.exe'
            if ($LASTEXITCODE -ne 0) { throw "signature verification failed" }
          }
          finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Build portable package
        run: .\scripts\build_portable.ps1

      # A package that cannot start is worse than no package. This launches
      # the real .exe on the runner and fails if it exits non-zero, dies, or
      # never comes up -- catching the missing-DLL and missing-hidden-import
      # class of failure that only appears after packaging.
      - name: Smoke-test the packaged executable
        env:
          QT_QPA_PLATFORM: offscreen
          MONITRA_DATA_DIR: ${{ runner.temp }}/monitra-smoke
        run: .\scripts\smoke_test_package.ps1

      # A checksum beside each artifact is what lets a member of staff (or IT)
      # confirm the installer they downloaded is the one this build produced.
      # Computed here, on the runner that built the file, and published as a
      # sidecar with the release.
      - name: Checksums
        run: |
          Get-ChildItem dist/installer/Monitra-Setup-*.exe, dist/Monitra-Portable-*.zip |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)" | Out-File "$($_.FullName).sha256" -Encoding ascii
              Write-Host "$hash  $($_.Name)"
            }

      - uses: actions/upload-artifact@v5
        with:
          name: Monitra-Windows-${{ steps.version.outputs.version }}
          path: |
            desktop/dist/installer/Monitra-Setup-*.exe
            desktop/dist/installer/Monitra-Setup-*.exe.sha256
            desktop/dist/Monitra-Portable-*.zip
            desktop/dist/Monitra-Portable-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  # ── macOS ──────────────────────────────────────────────────────────────────
  macos:
    name: macOS package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon. macos-14 and later are arm64 runners.
          - arch: arm64
            runner: macos-14
          # Intel. This was macos-13, which GitHub retired on 2025-12-04. A
          # workflow asking for a retired label does not fail -- it queues for
          # a runner that will never exist, and because the release job needs
          # this matrix, the whole release silently hangs. That is exactly what
          # happened to the first v1.1.0 run: Windows and arm64 went green in
          # minutes while this entry sat queued.
          #
          # macos-15-intel is GitHub's named replacement for x86_64. The note
          # this comment used to carry -- "macos-13 is the last x86_64 runner,
          # drop this entry when it goes" -- was overtaken by that label
          # existing, so the honest per-architecture build is kept rather than
          # dropped.
          #
          # Apple has discontinued x86_64 and GitHub retires macOS Intel
          # entirely after the macOS 15 image goes in Fall 2027. When that
          # happens there is no Intel runner to move to: drop this entry and
          # say so in the release notes rather than cross-building, because an
          # untested "universal" claim is worse than an honest
          # single-architecture build.
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Read the version
        id: version
        run: echo "version=$(python -c 'import version; print(version.VERSION)')" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Architecture boundaries
        run: python tools/check_architecture.py

      - name: Changelog entry for this version
        run: python tools/check_changelog.py

      # One interpreter per test module. Under the offscreen platform on these
      # runners the single-process run dies inside Qt (bus error on Apple
      # Silicon, segmentation fault on Intel) while a test shows an ordinary
      # top-level window, at a point that moved between builds -- state one
      # module leaves behind for the next, which one crash then hides for
      # every module after it. Each module gets its own QApplication, every
      # module reports, and a crash is attributed to its file. Nothing is
      # skipped or retried; see tools/run_tests_per_module.py.
      - name: Regression suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/run_tests_per_module.py

      # Signing and notarization are driven entirely by repository secrets. If
      # they are absent -- which is the current state -- the build produces an
      # unsigned .app and .dmg and says so, rather than failing or pretending.
      # See BUILD.md "Signing and notarization" for the exact secrets to add.
      # The `secrets` context cannot be used in a step-level `if`, so the value
      # is bound to an env var first and the presence check is made on that.
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/certificate.p12

      # Notarization needs a *keychain profile*, and a fresh runner has none.
      # MACOS_NOTARY_PROFILE alone was never enough: it is only the name of a
      # profile that `xcrun notarytool store-credentials` creates locally, so
      # setting it on a runner pointed notarytool at nothing and the
      # submission failed. The profile is created here instead, from the
      # Apple credentials, into the same keychain the certificate was
      # imported into and which the previous step left unlocked and default.
      #
      # The name is a fixed local constant, not a secret: it identifies a
      # profile that lives for the length of this job and nothing else. The
      # app-specific password is an Apple ID password scoped to notarization
      # (generated at appleid.apple.com), never the account password, and it
      # is passed through the environment so it is not visible in the log or
      # in `ps`.
      #
      # Signing is a prerequisite, not an alternative: Gatekeeper rejects a
      # notarized-but-unsigned bundle, so this is gated on the identity being
      # configured too. With the credentials absent the build is unsigned and
      # un-notarized and says so, exactly as before.
      - name: Create the notarization profile
        id: notary
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        if: ${{ env.MACOS_NOTARY_APPLE_ID != '' && env.MACOS_NOTARY_TEAM_ID != '' && env.MACOS_NOTARY_PASSWORD != '' && env.MACOS_CODESIGN_IDENTITY != '' }}
        run: |
          xcrun notarytool store-credentials "monitra-notary" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD"
          echo "profile=monitra-notary" >> "$GITHUB_OUTPUT"
          echo "Notarization profile created."

      - name: Build application and DMG
        env:
          MONITRA_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          # Empty unless the step above ran, which is what build_macos.sh
          # checks to decide whether to submit for notarization.
          MONITRA_NOTARY_PROFILE: ${{ steps.notary.outputs.profile }}
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh

      # Independent confirmation, on the artifact itself, that what the build
      # script reported actually holds. build_macos.sh already runs `stapler
      # validate`; this asks the question a user's Mac asks -- would Gatekeeper
      # open this -- and fails the build if the answer is no. A DMG that says
      # it is notarized but is refused on first launch is the failure this
      # catches, and it is not detectable any other way before a user hits it.
      - name: Verify signature, notarization and Gatekeeper
        if: ${{ steps.notary.outputs.profile != '' }}
        run: |
          set -euo pipefail
          APP="dist/Monitra.app"
          echo "== codesign =="
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=4 "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|Timestamp'
          echo "== Gatekeeper assessment of the .app =="
          spctl --assess --type execute --verbose=4 "$APP"
          for dmg in dist/Monitra-macOS-*.dmg; do
            echo "== $dmg =="
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          done
          echo "Signed, notarized, stapled and accepted by Gatekeeper."

      - name: Smoke-test the packaged application
        env:
          QT_QPA_PLATFORM: offscreen
          MONITRA_DATA_DIR: ${{ runner.temp }}/monitra-smoke
        run: |
          chmod +x scripts/smoke_test_package.sh
          ./scripts/smoke_test_package.sh

      - name: Checksums
        run: |
          for dmg in dist/Monitra-macOS-*.dmg; do
            shasum -a 256 "$dmg" | awk '{print $1 "  " FILENAME}' FILENAME="$(basename "$dmg")" \
              > "$dmg.sha256"
            cat "$dmg.sha256"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: Monitra-macOS-${{ matrix.arch }}-${{ steps.version.outputs.version }}
          path: |
            desktop/dist/Monitra-macOS-*.dmg
            desktop/dist/Monitra-macOS-*.dmg.sha256
          if-no-files-found: error
          retention-days: 30

  # ── Release ────────────────────────────────────────────────────────────────
  release:
    name: Publish release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Where the installers are published for people to download.
    #
    # Release assets inherit the repository's visibility -- GitHub has no
    # per-asset public switch -- so a download link only works for everyone
    # when the repository holding the release is PUBLIC. This repository is
    # public today, and `RELEASES_REPO` points at it, so the job's own token
    # publishes here and the download page and the in-app updater can fetch
    # the installers.
    #
    # To publish somewhere else -- a separate installer-only repository, if
    # this one is ever made private again -- set the `RELEASES_REPO` variable
    # to it (owner/name) and `RELEASES_REPO_TOKEN` to a token with
    # `contents: write` on that repository. Both are required together: with
    # a token that cannot write there GitHub answers 404 and the publish
    # fails (v1.2.1's second attempt against a private installer repository).
    # That repository must be public too, for the same reason as above.
    env:
      RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
      # The tag the release is filed under. On a tag push it is the pushed
      # tag; on a workflow_dispatch with "Attach the artifacts" it is derived
      # from version.py, so the release is never filed under a *branch* name
      # ("smit") -- which is what `github.ref_name` is on a dispatch.
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.windows.outputs.version) }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          # The public artifact repository, so the download URLs the backend
          # derives are reachable without a GitHub account. Falls back to this
          # repository when RELEASES_REPO is unset.
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true          # a human checks the artifacts before it goes out
          # GitHub composes release notes from the commits behind the tag, so
          # it can only do that where the source lives. Asked to do it in an
          # installer-only repository -- whose tag is created by this very
          # step and has no history -- it answers 404 and the publish fails
          # (v1.2.1, first attempt). The hand-written changelog is the release
          # note either way; the generated list is a bonus in this repository.
          generate_release_notes: ${{ env.RELEASES_REPO == github.repository }}
          body: |
            ## Monitra desktop

            | Platform | Download |
            |---|---|
            | Windows 10/11 (64-bit) | `Monitra-Setup-<version>.exe` |
            | Windows, no install | `Monitra-Portable-<version>.zip` |
            | macOS, Apple Silicon | `Monitra-macOS-arm64-<version>.dmg` |
            | macOS, Intel | `Monitra-macOS-x86_64-<version>.dmg` |

            macOS ships one build per architecture. Apple Silicon and Intel are
            different downloads — check which Mac you have before downloading.

            Python is not required — everything the application needs is inside
            the package.

            Each artifact has a `.sha256` sidecar. To verify a download:
            `Get-FileHash <file> -Algorithm SHA256` on Windows,
            `shasum -a 256 <file>` on macOS.

            **These builds are unsigned unless the signing secrets were
            configured for this run.** An unsigned Windows installer triggers a
            SmartScreen warning on first run; an unsigned macOS build is
            refused by Gatekeeper on any Mac other than the one that built it.
            See `desktop/BUILD.md` for what signing and notarization require.

      # Tell the backend what was built, so the in-app updater can offer it.
      #
      # Every artifact is registered as a DRAFT. CI can prove a build compiles,
      # starts and passes its tests; it cannot decide the build is good, so it
      # does not get to publish one. A person publishes the GitHub release and
      # then the backend release, after the pilot ring has run it -- the same
      # gate that already exists for the GitHub draft.
      #
      # The step never fails the workflow. The artifacts and the GitHub release
      # are good either way, and a backend that was unreachable for a minute
      # must not turn a good build into a failed one; the step can be re-run.
      # With the two secrets unset -- a fork, say -- it skips entirely.
      - name: Register the release with the backend
        working-directory: desktop
        continue-on-error: true
        env:
          MONITRA_API_BASE_URL: ${{ secrets.MONITRA_API_BASE_URL }}
          # A service credential: a long-lived API key belonging to a machine,
          # not a person. It authenticates an account holding the `release_bot`
          # role, whose entire authority is `manage_desktop_releases`, and that
          # account has no password at all -- this key is its only credential.
          #
          # Not a password: the password path is `/auth/dev-login`, which is
          # 404 whenever ENV=production, and no deployment should stay in
          # development mode to keep a build step working.
          # Not an access token: those expire after thirty minutes, so one
          # stored here would be dead long before the next release.
          MONITRA_RELEASE_CREDENTIAL: ${{ secrets.MONITRA_RELEASE_CREDENTIAL }}
        run: |
          python tools/register_release.py \
            --tag "${RELEASE_TAG}" \
            --repo "${RELEASES_REPO}" \
            --artifacts $(find ../artifacts -type f \
              \( -name 'Monitra-Setup-*.exe' -o -name 'Monitra-macOS-*.dmg' \) | tr '\n' ' ')
