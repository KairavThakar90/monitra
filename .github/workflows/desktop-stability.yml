name: Desktop stability

# Protects the Monitra desktop background runtime against regression.
#
# The runtime was rebuilt after a production-stability audit; the checks here
# are the ones that would have caught the original defects. See
# desktop/ARCHITECTURE.md and desktop/DO_NOT_DO.md.

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-stability.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-stability.yml"
  workflow_dispatch:

concurrency:
  group: desktop-stability-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The boundary check is pure AST analysis — no Qt, no dependencies.
      - name: Check ownership boundaries
        run: python tools/check_architecture.py

      # A version bump without a written release note is caught here, before
      # the tag exists -- not at release time, when the note is being written
      # under pressure from commit titles.
      - name: Check the changelog documents this version
        run: python tools/check_changelog.py

  tests:
    name: Regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # QT_QPA_PLATFORM=offscreen hits a known PySide6/Qt bug on Ubuntu:
      # intermittent SIGSEGV (exit 139) inside Qt's own offscreen backend when
      # a widget is shown, unrelated to anything in this codebase. Xvfb gives
      # Qt a real (virtual) display and the mature, stable "xcb" platform
      # instead, which does not carry that defect.
      - name: Run tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" python -m pytest tests/ -v --tb=short

  launch-cycles:
    name: Launch/quit cycles
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The audited build launched correctly once and hung the next time, so a
      # single run proves nothing. This fails if any cycle hangs, crashes,
      # leaves a thread running, or escalates shutdown to terminate().
      # Xvfb, not QT_QPA_PLATFORM=offscreen -- see the "Run tests" step above.
      - name: Ten launch/quit cycles
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" python tests/soak/run_launch_cycles.py --cycles 10 --uptime 5

  soak:
    name: Soak and scale
    runs-on: ubuntu-latest
    needs: tests
    # Expensive; runs on main and on demand rather than on every PR.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Sync bursts sized for 200 concurrent users, network flapping, rapid
      # timer cycling. Fails on thread growth, duplicate operations, a queue
      # that does not drain, or an unclean shutdown.
      # Xvfb, not QT_QPA_PLATFORM=offscreen -- see the "Run tests" step above.
      - name: Soak under 200-user-equivalent load
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" python tests/soak/run_soak.py --duration 180 --users 200 --drain 180
