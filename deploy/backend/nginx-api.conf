# Monitra API over plain HTTP — reverse proxy to Uvicorn on 127.0.0.1:8000.
# Installed at /etc/nginx/sites-available/monitra-api by setup_vm.sh, which
# substitutes __SERVER_NAME__. Once a certificate exists for SITE_DOMAIN,
# setup_vm.sh installs nginx-api-tls.conf instead.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAME__;

    # Screenshot uploads are capped at 5 MB by the API; leave headroom.
    client_max_body_size 10m;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
