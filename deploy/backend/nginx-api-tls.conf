# Monitra API over TLS. Installed by setup_vm.sh when SITE_DOMAIN is set and
# a Let's Encrypt certificate exists for it (see README, "TLS").
# setup_vm.sh substitutes __SERVER_NAME__.

# The web VM proxies its /api/ traffic here over the VPC on port 80. Those
# requests are served directly, keeping the client details the web VM
# forwarded; anything else arriving on port 80 is sent to HTTPS.
geo $monitra_internal {
    default      0;
    10.128.0.0/9 1;
}

map $http_x_forwarded_proto $monitra_forwarded_proto {
    default $scheme;
    https   https;
}

map $http_x_real_ip $monitra_real_ip {
    default $remote_addr;
    "~."    $http_x_real_ip;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAME__;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        if ($monitra_internal = 0) {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $monitra_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $monitra_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name __SERVER_NAME__;

    ssl_certificate     /etc/letsencrypt/live/__SERVER_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SERVER_NAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Screenshot uploads are capped at 5 MB by the API; leave headroom.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
