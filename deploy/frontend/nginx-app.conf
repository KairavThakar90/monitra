# Monitra web client over plain HTTP — static Vite build plus a same-origin
# /api/ proxy to the backend VM over the VPC's internal network.
# Installed at /etc/nginx/sites-available/monitra-app by setup_vm.sh, which
# substitutes __SERVER_NAME__ and __BACKEND_UPSTREAM__. Once a certificate
# exists for SITE_DOMAIN, setup_vm.sh installs nginx-app-tls.conf instead.

upstream monitra_backend {
    server __BACKEND_UPSTREAM__;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAME__;

    root /var/www/monitra/current;
    index index.html;

    client_max_body_size 10m;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/monitra/acme;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # The build is made with VITE_API_BASE=/api/v1, so every API call is
    # same-origin and proxied here. No CORS configuration is involved.
    location /api/ {
        proxy_pass http://monitra_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Vite emits content-hashed filenames under /assets/; cache them forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: every other path serves index.html and the router takes over.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
